kind: security
body: 'Go toolchain 1.26.8 → 1.26.10 (go.mod, magefiles/go.mod and go.work) fixes CVE-2026-56857, a Critical Go standard library vulnerability on Windows. As a library, consumers build with their own Go; this sets the toolchain used to build and test the SDK itself.'
